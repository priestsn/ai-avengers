<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1529"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Navbar -->
  <rect width="1280" height="60" fill="#0d1629" opacity="0.95"/>
  <circle cx="32" cy="30" r="12" fill="#3b82f6"/>
  <text x="50" y="36" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="bold">AI Avengers</text>
  <rect x="120" y="18" width="130" height="24" rx="12" fill="#1e293b"/>
  <text x="185" y="33" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Recruiting Platform</text>

  <!-- Divider -->
  <line x1="640" y1="60" x2="640" y2="720" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT PANEL: HR Login -->
  <rect x="0" y="60" width="640" height="660" fill="#0d1629"/>
  <!-- HR Icon -->
  <rect x="290" y="110" width="60" height="60" rx="8" fill="#1e3a5f"/>
  <text x="320" y="150" font-family="Arial,sans-serif" font-size="28" fill="#3b82f6" text-anchor="middle">📊</text>
  <text x="320" y="210" font-family="Arial,sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Portale HR</text>
  <text x="320" y="240" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Gestisci i colloqui e analizza i report AI dei candidati.</text>

  <!-- Login Form -->
  <rect x="110" y="270" width="420" height="260" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="140" y="310" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Email</text>
  <rect x="130" y="320" width="380" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="160" y="347" font-family="Arial,sans-serif" font-size="13" fill="#475569">✉ Email HR</text>
  <text x="140" y="390" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Password</text>
  <rect x="130" y="400" width="380" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="160" y="427" font-family="Arial,sans-serif" font-size="13" fill="#475569">🔒 Password</text>
  <rect x="130" y="462" width="380" height="44" rx="8" fill="#3b82f6"/>
  <text x="320" y="490" font-family="Arial,sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Accedi alla Dashboard</text>

  <!-- RIGHT PANEL: Candidate -->
  <rect x="640" y="60" width="640" height="660" fill="#0a0e1a"/>
  <!-- Avatar Icon -->
  <circle cx="960" cy="220" r="50" fill="#1e3a5f"/>
  <text x="960" y="233" font-family="Arial,sans-serif" font-size="36" fill="#3b82f6" text-anchor="middle">👤</text>
  <text x="960" y="320" font-family="Arial,sans-serif" font-size="34" fill="white" text-anchor="middle" font-weight="bold">Entra nel Team</text>
  <text x="960" y="360" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Scopri il futuro del recruiting.</text>
  <text x="960" y="384" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Completa il tuo colloquio video con IA in soli 7 minuti.</text>
  <rect x="790" y="420" width="340" height="50" rx="25" fill="white"/>
  <text x="960" y="451" font-family="Arial,sans-serif" font-size="16" fill="#0a0e1a" text-anchor="middle" font-weight="bold">Vedi le Posizioni Aperte →</text>
</svg>
