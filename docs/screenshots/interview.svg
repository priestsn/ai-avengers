<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1529"/>
    </linearGradient>
    <linearGradient id="avatar-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="camfeed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#273549"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Navbar -->
  <rect width="1280" height="60" fill="#0d1629" opacity="0.95"/>
  <circle cx="32" cy="30" r="12" fill="#3b82f6"/>
  <text x="50" y="36" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="bold">AI Avengers</text>

  <!-- Progress steps -->
  <circle cx="440" cy="30" r="12" fill="#3b82f6"/>
  <text x="440" y="35" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">1</text>
  <text x="440" y="53" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Dettagli</text>
  <line x1="460" y1="30" x2="530" y2="30" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="540" cy="30" r="12" fill="#3b82f6"/>
  <text x="540" y="35" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">2</text>
  <text x="540" y="53" font-family="Arial,sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Colloquio</text>
  <line x1="560" y1="30" x2="630" y2="30" stroke="#1e293b" stroke-width="2"/>
  <circle cx="640" cy="30" r="12" fill="#1e293b"/>
  <text x="640" y="35" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">3</text>
  <text x="640" y="53" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Risultati</text>

  <!-- Timer -->
  <rect x="1100" y="12" width="120" height="36" rx="8" fill="#1e293b"/>
  <text x="1160" y="35" font-family="Arial,sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">⏱ 05:42</text>

  <!-- VIDEO TILE: candidato -->
  <rect x="20" y="80" width="620" height="400" rx="12" fill="url(#camfeed)" stroke="#3b82f6" stroke-width="2"/>
  <!-- silhouette candidato -->
  <circle cx="330" cy="230" r="55" fill="#334155"/>
  <rect x="255" y="295" width="150" height="90" rx="45" fill="#334155"/>
  <text x="330" y="248" font-family="Arial,sans-serif" font-size="44" fill="#64748b" text-anchor="middle">👤</text>
  <!-- LIVE + nome -->
  <rect x="36" y="96" width="90" height="26" rx="13" fill="#14532d" opacity="0.92"/>
  <text x="81" y="113" font-family="Arial,sans-serif" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="bold">● LIVE</text>
  <rect x="36" y="438" width="190" height="28" rx="8" fill="#000000" opacity="0.6"/>
  <text x="46" y="457" font-family="Arial,sans-serif" font-size="13" fill="white">🎥 Marco — Candidato</text>
  <!-- mic attivo -->
  <rect x="560" y="438" width="64" height="28" rx="8" fill="#000000" opacity="0.6"/>
  <text x="592" y="457" font-family="Arial,sans-serif" font-size="13" fill="#22c55e" text-anchor="middle">🎤</text>

  <!-- VIDEO TILE: Harid AI -->
  <rect x="660" y="80" width="600" height="400" rx="12" fill="#0d1629" stroke="#1e293b" stroke-width="1"/>
  <rect x="676" y="96" width="568" height="368" rx="8" fill="#111827"/>
  <!-- avatar grande -->
  <circle cx="960" cy="230" r="70" fill="url(#avatar-glow)" stroke="#3b82f6" stroke-width="3"/>
  <text x="960" y="250" font-family="Arial,sans-serif" font-size="52" fill="white" text-anchor="middle">🤖</text>
  <text x="960" y="330" font-family="Arial,sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Harid AI</text>
  <text x="960" y="354" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Recruiter Senior · AI Avengers</text>
  <!-- speaking waveform -->
  <rect x="900" y="372" width="4" height="26" rx="2" fill="#3b82f6"/>
  <rect x="910" y="366" width="4" height="38" rx="2" fill="#3b82f6"/>
  <rect x="920" y="372" width="4" height="26" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="930" y="368" width="4" height="34" rx="2" fill="#3b82f6"/>
  <rect x="940" y="364" width="4" height="42" rx="2" fill="#3b82f6"/>
  <rect x="950" y="370" width="4" height="30" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="960" y="366" width="4" height="38" rx="2" fill="#3b82f6"/>
  <rect x="970" y="372" width="4" height="26" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="980" y="368" width="4" height="34" rx="2" fill="#3b82f6"/>
  <rect x="990" y="370" width="4" height="30" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="1000" y="366" width="4" height="38" rx="2" fill="#3b82f6"/>
  <rect x="1010" y="372" width="4" height="26" rx="2" fill="#3b82f6" opacity="0.7"/>
  <text x="960" y="428" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">🔊 Harid sta parlando...</text>
  <!-- LIVE + nome -->
  <rect x="690" y="110" width="90" height="26" rx="13" fill="#1e3a5f" opacity="0.95"/>
  <text x="735" y="127" font-family="Arial,sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold">● LIVE</text>

  <!-- Bottom: ultima battuta + trascrizione compatta -->
  <rect x="20" y="492" width="1240" height="120" rx="10" fill="#0a0f1e" stroke="#1e293b" stroke-width="1"/>
  <rect x="36" y="506" width="700" height="44" rx="8" fill="#1e3a5f"/>
  <text x="52" y="524" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" font-weight="bold">HARID AI</text>
  <text x="52" y="542" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">Nel tuo ultimo progetto React — quanti componenti gestivi? Hai usato TypeScript?</text>
  <rect x="750" y="506" width="320" height="44" rx="8" fill="#1e293b"/>
  <text x="766" y="524" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" font-weight="bold">MARCO</text>
  <text x="766" y="542" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">Team di 4 su un SaaS B2B da 10k utenti...</text>
  <text x="36" y="582" font-family="Arial,sans-serif" font-size="12" fill="#475569">Trascrizione completa · parola rilevata: 342 · valutazione live con Gemini 2.5 Flash</text>

  <!-- Controls -->
  <rect x="20" y="624" width="300" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="170" y="656" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">🎤 Microfono attivo</text>
  <rect x="332" y="624" width="300" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="482" y="656" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">📷 Camera attiva</text>
  <rect x="960" y="624" width="300" height="52" rx="10" fill="#7f1d1d"/>
  <text x="1110" y="656" font-family="Arial,sans-serif" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">■ Termina colloquio</text>
</svg>
