<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1529"/>
    </linearGradient>
    <linearGradient id="avatar-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Navbar -->
  <rect width="1280" height="60" fill="#0d1629" opacity="0.95"/>
  <circle cx="32" cy="30" r="12" fill="#3b82f6"/>
  <text x="50" y="36" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="bold">AI Avengers</text>

  <!-- Progress steps -->
  <circle cx="440" cy="30" r="12" fill="#3b82f6"/>
  <text x="440" y="35" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">1</text>
  <text x="440" y="53" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Dettagli</text>
  <line x1="460" y1="30" x2="530" y2="30" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="540" cy="30" r="12" fill="#3b82f6"/>
  <text x="540" y="35" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle">2</text>
  <text x="540" y="53" font-family="Arial,sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Colloquio</text>
  <line x1="560" y1="30" x2="630" y2="30" stroke="#1e293b" stroke-width="2"/>
  <circle cx="640" cy="30" r="12" fill="#1e293b"/>
  <text x="640" y="35" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">3</text>
  <text x="640" y="53" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Risultati</text>

  <!-- Timer -->
  <rect x="1100" y="12" width="120" height="36" rx="8" fill="#1e293b"/>
  <text x="1160" y="35" font-family="Arial,sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">⏱ 05:42</text>

  <!-- LEFT: Camera / Video Feed Area -->
  <rect x="20" y="80" width="500" height="360" rx="12" fill="#0d1629" stroke="#1e293b" stroke-width="1"/>
  <!-- Camera feed placeholder -->
  <rect x="40" y="100" width="460" height="320" rx="8" fill="#111827"/>
  <text x="270" y="240" font-family="Arial,sans-serif" font-size="40" fill="#1e293b" text-anchor="middle">📷</text>
  <text x="270" y="285" font-family="Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle">Camera attiva</text>
  <!-- Camera label -->
  <rect x="50" y="380" width="120" height="24" rx="12" fill="#14532d" opacity="0.9"/>
  <text x="110" y="396" font-family="Arial,sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">● LIVE</text>

  <!-- Recording indicator -->
  <rect x="20" y="450" width="500" height="60" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <circle cx="50" cy="480" r="8" fill="#ef4444"/>
  <text x="70" y="485" font-family="Arial,sans-serif" font-size="13" fill="#ef4444" font-weight="bold">● REGISTRAZIONE IN CORSO</text>
  <text x="380" y="485" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Parola rilevata: 342</text>

  <!-- Mute / End buttons -->
  <rect x="20" y="520" width="240" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="548" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">🎤 Microfono Attivo</text>
  <rect x="280" y="520" width="240" height="46" rx="8" fill="#7f1d1d"/>
  <text x="400" y="548" font-family="Arial,sans-serif" font-size="14" fill="#ef4444" text-anchor="middle">■ Termina Colloquio</text>

  <!-- RIGHT: Harid AI Panel -->
  <rect x="540" y="80" width="720" height="580" rx="12" fill="#0d1629" stroke="#1e293b" stroke-width="1"/>

  <!-- Harid AI Header -->
  <rect x="560" y="100" width="680" height="80" rx="10" fill="#111827"/>
  <!-- AI Avatar -->
  <circle cx="605" cy="140" r="28" fill="url(#avatar-glow)"/>
  <text x="605" y="148" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle">🤖</text>
  <text x="650" y="128" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="bold">Harid AI</text>
  <text x="650" y="150" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Recruiter Senior · AI Avengers</text>
  <!-- Status badge -->
  <rect x="1130" y="120" width="90" height="24" rx="12" fill="#1e3a5f"/>
  <text x="1175" y="136" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">● In ascolto</text>

  <!-- Waveform / Audio visualizer -->
  <rect x="560" y="195" width="680" height="60" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="640" y="232" font-family="Arial,sans-serif" font-size="12" fill="#64748b">🔊 Harid sta parlando...</text>
  <!-- Waveform bars -->
  <rect x="780" y="210" width="4" height="30" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="790" y="205" width="4" height="40" rx="2" fill="#3b82f6"/>
  <rect x="800" y="215" width="4" height="20" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="810" y="208" width="4" height="34" rx="2" fill="#3b82f6"/>
  <rect x="820" y="212" width="4" height="26" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="830" y="204" width="4" height="42" rx="2" fill="#3b82f6"/>
  <rect x="840" y="217" width="4" height="16" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="850" y="210" width="4" height="30" rx="2" fill="#3b82f6"/>
  <rect x="860" y="206" width="4" height="38" rx="2" fill="#3b82f6" opacity="0.9"/>
  <rect x="870" y="213" width="4" height="24" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="880" y="209" width="4" height="32" rx="2" fill="#3b82f6"/>

  <!-- Chat transcript -->
  <rect x="560" y="268" width="680" height="340" rx="8" fill="#0a0f1e" stroke="#1e293b" stroke-width="1"/>
  <text x="580" y="296" font-family="Arial,sans-serif" font-size="12" fill="#475569">Trascrizione conversazione</text>

  <!-- Harid bubble -->
  <rect x="570" y="308" width="540" height="60" rx="8" fill="#1e3a5f"/>
  <text x="590" y="328" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" font-weight="bold">HARID AI</text>
  <text x="590" y="348" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">Ciao Marco, sono Harid di AI Avengers. Partiamo subito,</text>
  <text x="590" y="364" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">raccontami del tuo percorso con React.</text>

  <!-- User bubble -->
  <rect x="680" y="378" width="530" height="60" rx="8" fill="#1e293b"/>
  <text x="700" y="398" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" font-weight="bold">MARCO (candidato)</text>
  <text x="700" y="418" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">Ho 5 anni di esperienza React, ho guidato team di 4</text>
  <text x="700" y="434" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">frontend developer su un SaaS B2B da 10k utenti.</text>

  <!-- Harid bubble 2 -->
  <rect x="570" y="448" width="540" height="60" rx="8" fill="#1e3a5f"/>
  <text x="590" y="468" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" font-weight="bold">HARID AI</text>
  <text x="590" y="488" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">Interessante. Nel tuo ultimo progetto React — quanti</text>
  <text x="590" y="504" font-family="Arial,sans-serif" font-size="12" fill="#e2e8f0">componenti gestivi? Hai usato TypeScript?</text>

  <!-- Typing indicator -->
  <rect x="570" y="522" width="200" height="36" rx="8" fill="#111827"/>
  <circle cx="595" cy="540" r="5" fill="#94a3b8"/>
  <circle cx="613" cy="540" r="5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="631" cy="540" r="5" fill="#94a3b8" opacity="0.3"/>
  <text x="650" y="545" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Marco sta rispondendo...</text>
</svg>
