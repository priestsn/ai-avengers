kind = "web"
previewPath = "/"
title = "Video Interview Platform"
version = "1.0.0"
id = "artifacts/video-interview"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24371

[services.development]
run = "pnpm --filter @workspace/video-interview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-interview", "run", "build" ]
publicDir = "artifacts/video-interview/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24371"
BASE_PATH = "/"
